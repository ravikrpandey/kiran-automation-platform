services:
  - type: web
    name: kiran-automation-demo
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@10.18.0 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/ready
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      # Render supplies PORT at runtime. Do not set a fixed production port here.
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD_HASH
        sync: false
      # Intentionally blank until a supported mail provider/configuration is approved.
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: ""
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: MAIL_FROM
        value: ""
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
